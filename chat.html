<script>
(() => {
const $=id=>document.getElementById(id), colors=['#a78bfa','#f472b6','#60a5fa','#34d399','#fbbf24','#fb923c','#22d3ee'];
let chat={joined:false,messages:[],profile:null},selected=null,focusBefore=null,edit=null,previousNotice=0,lastMessages='',lastSuccessId=0,imageBusy=false,replyTarget=null,lastJump=0,highlightId=null,highlightTimer=null;
let mediaRequestId=0;const mediaPending=new Map();
function mediaRequest(data){return new Promise((resolve,reject)=>{const requestId=++mediaRequestId;const timer=setTimeout(()=>{mediaPending.delete(requestId);reject(Error('Media search timed out. Try again.'));},16000);mediaPending.set(requestId,{resolve,reject,timer});emit('media',{...data,requestId});});}
const mediaConfig="__SEACHAT_MEDIA_CONFIG__";
let readingInitialized=false,lastOpen=0,acknowledged=0,attachment=null,mediaQuery='',pickerGeneration=0,searchTimer=null,searchAbort=null;
const joinForm=document.getElementById('join');
let lastReadingStatus=null,draftSpoiler=false;const revealedSpoilers=new Set();
function concealed(m){return !!m.spoiler&&m.userId!==chat.profile?.userId&&!revealedSpoilers.has(m.id);}
function safeText(m){return concealed(m)?'Spoiler message':m.text;}
function drawSpoilerToggle(){$('spoiler-toggle').setAttribute('aria-pressed',String(draftSpoiler));}
function spoilerContent(m,content){const wrap=element('div','spoiler-wrap'+(concealed(m)?' concealed':'')+(m.spoiler&&m.userId===chat.profile?.userId?' spoiler-own':''));const inner=element('div','spoiler-content');inner.append(content);wrap.append(inner);if(concealed(m)){inner.setAttribute('aria-hidden','true');inner.inert=true;const reveal=element('button','spoiler-reveal','Spoiler · Click to reveal');reveal.type='button';reveal.onclick=()=>{revealedSpoilers.add(m.id);drawHistory();};wrap.append(reveal);}return wrap;}
const emit=(event,data)=>window.webview.send(event,data);
const element=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;};
const shortTime=value=>new Date(value).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function feedback(text){$('feedback').textContent=text||'';$('feedback').hidden=!text;if(!$('overlay').hidden){$('modal-feedback').textContent=text||'';$('modal-feedback').hidden=!text;}}
function avatar(profile){if(profile.avatar){const img=element('img','avatar');img.src=profile.avatar;img.alt='';return img;}const el=element('span','avatar',(profile.name||'?').slice(0,1).toUpperCase()),color=colors.includes(profile.color)?profile.color:colors[0];el.style.color=color;el.style.background=color+'24';return el;}
function replyIcon(){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),path=document.createElementNS('http://www.w3.org/2000/svg','path');svg.setAttribute('viewBox','0 0 24 24');path.setAttribute('d','m9 5-7 7 7 7M2 12h12a7 7 0 0 1 7 7');svg.append(path);return svg;}
function selectReply(message){replyTarget=message;const summary=$('reply-summary');summary.replaceChildren(element('strong','',message.name+' · '),document.createTextNode(safeText(message)));$('reply-bar').hidden=false;$('draft').focus();}
function cancelReply(){replyTarget=null;$('reply-bar').hidden=true;$('reply-summary').replaceChildren();}
function updateReading(){
 const history=$('history');const readingCurrent=readingInitialized&&$('overlay').hidden&&!!chat.joined&&!!chat.visible&&!document.hidden&&document.hasFocus()&&!chat.contextId&&history.scrollHeight-history.scrollTop-history.clientHeight<70;
 if(readingCurrent!==lastReadingStatus){lastReadingStatus=readingCurrent;emit('reading',{latest:readingCurrent});}
 const list=$('history'),latest=!chat.contextId&&list.scrollHeight-list.scrollTop-list.clientHeight<70;
 $('jump-present').hidden=!chat.joined||!readingInitialized||latest;$('jump-present').style.bottom=(document.querySelector('footer').offsetHeight+12)+'px';
 if(!readingInitialized||chat.visible===false||document.visibilityState!=='visible'||!$('overlay').hidden||!latest)return;
 const id=chat.messages?.[chat.messages.length-1]?.id||0;
 if(id>acknowledged){acknowledged=id;emit('readMessages',{messageId:id});}
}
function mediaUrl(value){try{const u=new URL(value);return u.protocol==='https:'&&['static.klipy.com','static1.klipy.com','static2.klipy.com'].includes(u.hostname)&&!u.username&&!u.password&&!u.port&&/\.(gif|webp|png|jpg)$/i.test(u.pathname);}catch{return false;}}
function mediaElement(media,preview=false){
 const box=element('div','attachment'+(media.kind==='sticker'?' sticker':''));
 box.style.aspectRatio=media.width+'/'+media.height;
 const image=element('img');image.alt=media.title|| (media.kind==='gif'?'GIF':'Sticker');image.loading='lazy';image.referrerPolicy='no-referrer';
 if(mediaUrl(preview?media.previewUrl:media.url))image.src=preview?media.previewUrl:media.url;
 else {box.append(element('span','hint','Media unavailable'));return box;}
 image.onerror=()=>box.replaceChildren(element('span','hint','Media unavailable'));box.append(image);return box;
}
function drawAttachment(){
 const box=$('attachment-preview');box.replaceChildren();box.hidden=!attachment;if(!attachment)return;
 const remove=element('button','icon','✕');remove.type='button';remove.setAttribute('aria-label','Remove attachment');remove.onclick=()=>{attachment=null;drawAttachment();};
 box.append(mediaElement(attachment),element('span','reply-summary',attachment.title||'KLIPY '+attachment.kind),remove);
}
function registerShare(media){
 if(!mediaConfig.enabled)return;
 if(mediaConfig.proxy){mediaRequest({kind:media.kind,action:'share',id:media.id,query:media.query||''}).catch(()=>{});return;}
 fetch('https://api.klipy.com/api/v1/'+encodeURIComponent(mediaConfig.appKey)+'/'+(media.kind==='gif'?'gifs':'stickers')+'/share/'+encodeURIComponent(media.id),{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:'seachat-'+chat.profile.userId,q:media.query||''})}).catch(()=>{});
}
function openMediaPicker(){
 if(!mediaConfig.enabled)return;openModal('GIFs and stickers');
 const generation=++pickerGeneration;let kind='gif',page=1,query='';
 const tabs=element('div','media-tabs'),input=element('input'),grid=element('div','media-grid'),status=element('div','media-status'),more=element('button','secondary','Load more');
 input.type='search';input.placeholder='Search GIFs';input.maxLength=100;input.setAttribute('aria-label','Search GIFs and stickers');status.setAttribute('role','status');more.hidden=true;
 const buttons=['gif','sticker'].map(value=>{const button=element('button','secondary',value==='gif'?'GIFs':'Stickers');button.setAttribute('role','tab');button.setAttribute('aria-selected',String(value===kind));button.onclick=()=>{kind=value;buttons.forEach((b,i)=>b.setAttribute('aria-selected',String(['gif','sticker'][i]===kind)));input.placeholder='Search '+(kind==='gif'?'GIFs':'stickers');page=1;clearTimeout(searchTimer);load(false);};return button;});
 tabs.setAttribute('role','tablist');tabs.append(...buttons);$('modal-body').append(tabs,input,status,grid,more,element('p','provider-credit',mediaConfig.testRollout?'Powered by KLIPY · Test access: 100 requests/hour shared':'Powered by KLIPY'));
 let requestSequence=0;
 async function load(append){
  if(generation!==pickerGeneration)return;
  const sequence=++requestSequence;if(searchAbort)searchAbort.abort();searchAbort=new AbortController();status.textContent='Loading…';more.disabled=true;if(!append)grid.replaceChildren();
  query=input.value.trim();const url=new URL('https://api.klipy.com/api/v1/'+encodeURIComponent(mediaConfig.appKey)+'/'+(kind==='gif'?'gifs':'stickers')+'/'+(query?'search':'trending'));
  url.searchParams.set('page',String(page));url.searchParams.set('per_page','24');url.searchParams.set('content_filter','off');url.searchParams.set('customer_id','seachat-'+chat.profile.userId);url.searchParams.set('format_filter',kind==='gif'?'gif,webp,jpg':'webp,png,gif');if(query)url.searchParams.set('q',query);
  try{
   const res=mediaConfig.proxy?{ok:true,json:()=>mediaRequest({kind,query,page})}:await fetch(url.href,{credentials:'omit',signal:searchAbort.signal});if(!res.ok)throw Error(res.status===429?'Search limit reached. Try again later.':'Media search is unavailable. Try again.');
   const data=await res.json();if(generation!==pickerGeneration||sequence!==requestSequence)return;
   if(data.result===false)throw Error('Media search is unavailable. Try again.');
   const items=data.data?.data||[];
   for(const item of items){
    const formats=item.file?.sm||item.file?.md||{},image=formats.webp||formats.gif||formats.png,thumb=formats.jpg||formats.png||image;
    const tile=element('button');tile.setAttribute('aria-label','Select '+(item.title||kind));
    if(!image||!mediaUrl(image.url)||!thumb||!mediaUrl(thumb.url)){tile.disabled=true;tile.textContent='Unavailable';grid.append(tile);continue;}
    const media={provider:'klipy',kind,id:item.slug,title:String(item.title||'').slice(0,200),url:image.url,previewUrl:thumb.url,width:image.width,height:image.height,query};
    const img=element('img');img.src=image.url;img.alt=item.title||kind;img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{tile.disabled=true;tile.replaceChildren(element('span','hint','Unavailable'));};tile.append(img);
    tile.onclick=()=>{attachment=media;drawAttachment();closeModal();$('draft').focus();};grid.append(tile);
   }
   status.textContent=grid.children.length?'':'No results. Try another search.';more.hidden=!data.data?.has_next;
  }catch(e){if(e.name!=='AbortError'&&generation===pickerGeneration&&sequence===requestSequence){status.textContent=e.message;more.hidden=true;}}
  finally{if(generation===pickerGeneration&&sequence===requestSequence)more.disabled=false;}
 }
 input.oninput=()=>{clearTimeout(searchTimer);requestSequence++;if(searchAbort)searchAbort.abort();more.hidden=true;page=1;searchTimer=setTimeout(()=>load(false),400);};
 more.onclick=()=>{page++;load(true);};load(false);input.focus();
}
function jumpTo(id){emit('jump',{messageId:id});}
function drawHistory(){
 const list=$('history'),atBottom=readingInitialized&&list.scrollHeight-list.scrollTop-list.clientHeight<70,scroll=list.scrollTop;
 const anchor=Array.from(list.querySelectorAll('.message')).find(row=>row.getBoundingClientRect().bottom>list.getBoundingClientRect().top);
 const anchorId=anchor?.id,anchorTop=anchor?.getBoundingClientRect().top;
 list.replaceChildren();let day='';

function openSettings(){if(!chat.profile)return;openModal('Your profile');edit={...chat.profile};const picture=element('div','profile-picture'),preview=element('div'),controls=element('div','picture-actions');preview.append(avatar(edit));const upload=element('button','secondary','Upload image'),remove=element('button','secondary','Remove'),file=element('input');file.type='file';file.accept='image/jpeg,image/png,image/webp';file.hidden=true;upload.onclick=()=>file.click();remove.onclick=()=>{edit.avatar='';preview.replaceChildren(avatar(edit));};

function openReport(message){if(!chat.messages.length){feedback('There are no messages to report yet.');return;}openModal('Report a message');$('modal-body').append(element('p','hint','Reports are saved for moderator review. Reporting does not automatically remove the message or ban its sender.'));const choices=element('select');chat.messages.forEach(m=>{const option=element('option','',m.name+' · '+shortTime(m.createdAt)+' · '+safeText(m).slice(0,36));option.value=m.id;choices.append(option);});if(message)choices.value=message.id;const reason=element('select');['Spam','Harassment','Spoilers','Other'].forEach(value=>reason.append(element('option','',value)));const details=element('textarea','field-input');details.maxLength=1000;details.placeholder='Tell us more (optional)…';$('modal-body').append(field('Select a message',choices),field('Reason',reason),field('Add details (optional)',details));actions(()=>{if(!chat.busy)emit('report',{messageId:Number(choices.value),reason:reason.value,details:details.value});},'Submit report');}

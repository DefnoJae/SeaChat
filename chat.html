<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>SeaChat</title>
<style>
:root{color-scheme:dark;--bg:#101217;--surface:#191c23;--line:#30343f;--muted:#929bad;--text:#eef0f6;--accent:#a78bfa}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;color:var(--text);background:transparent}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}.app{height:100vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--bg);box-shadow:0 14px 44px #0006}header{display:flex;align-items:center;gap:10px;padding:20px;border-bottom:1px solid var(--line)}h1{font-size:23px;margin:0;letter-spacing:-.6px}.logo{width:32px;height:32px;border-radius:12px;background:#8b5cf6;display:grid;place-items:center}.dot{width:8px;height:8px;background:#6b7280;border-radius:50%}.dot.online{background:#34d399}.spacer{flex:1}.icon{display:grid;place-items:center;background:transparent;border:0;border-radius:10px;width:34px;height:34px;color:var(--muted)}.icon:hover{background:#ffffff0d;color:white}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}main{flex:1;min-height:0;overflow:auto;padding:18px 20px;scrollbar-width:thin;scrollbar-color:#3b4050 transparent}.message{display:flex;gap:11px;padding:12px 0}.avatar{width:38px;height:38px;flex-shrink:0;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-weight:650}.content{min-width:0;flex:1}.meta{display:flex;align-items:center;gap:9px}.name{font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{font-size:11px;color:var(--muted);white-space:nowrap}.more{margin-left:auto;width:26px;height:24px;font-size:18px;flex-shrink:0}.body{font-size:15px;line-height:1.5;margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.day{text-align:center;font-size:11px;color:var(--muted);margin:8px 0 14px}.empty{color:var(--muted);text-align:center;margin:60px 0;font-size:14px}footer{padding:12px 16px 16px}.composer{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:7px 8px 7px 14px}.composer textarea{resize:none;min-height:32px;max-height:80px;flex:1;min-width:0;padding:6px 0;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;line-height:20px}.send{width:34px;height:34px;flex-shrink:0;border:0;border-radius:50%;background:#8b5cf6;color:white;display:grid;place-items:center}.feedback{font-size:12px;color:#fda4af;padding:0 4px 8px;overflow-wrap:anywhere}.join{padding:28px 8px;display:grid;gap:16px}.join h2{font-size:20px;margin:0}.join p{font-size:13px;color:var(--muted);margin:0}.field{display:grid;gap:8px;margin:16px 0}.field label,.label{font-size:13px;color:#c8cdd8}input,select,textarea.field-input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#11141a;color:var(--text);font-size:14px}textarea.field-input{resize:vertical;min-height:78px}.primary,.secondary{border-radius:10px;padding:10px 16px;border:1px solid var(--line);font-size:13px}.primary{background:#8b5cf6;border-color:#8b5cf6;color:white}.secondary{background:transparent}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;padding:20px;z-index:5}.modal{width:100%;max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 16px 48px #0008}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.modal-head h2{font-size:18px;margin:0}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.profile-picture{display:flex;align-items:center;gap:12px;margin-top:20px}.profile-picture .avatar{width:56px;height:56px}.picture-actions{display:flex;flex-wrap:wrap;gap:8px}.hint{font-size:11px;color:var(--muted);line-height:1.5;margin:8px 0}.swatches{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:26px;height:26px;border:3px solid transparent;border-radius:50%;padding:0}.swatch.selected{outline:2px solid white;outline-offset:2px}.color-tools{display:flex;align-items:center;justify-content:space-between;margin:16px 0 12px}.random{border:0;background:transparent;color:var(--accent);font-size:12px}.menu{position:absolute;right:20px;z-index:4;width:180px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 10px 30px #0006}.menu button{width:100%;text-align:left;padding:10px;border:0;background:transparent;border-radius:8px;font-size:13px}.menu button:hover{background:#ffffff0b}.details{font-size:13px;line-height:1.8;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body>
<div class="app"><header><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4z"/><path d="M8 8h8M8 12h5"/></svg></span><h1>SeaChat</h1><span id="connection" class="dot" role="status" aria-label="Connecting"></span><span class="spacer"></span><button class="icon" id="settings" aria-label="Profile settings" title="Profile settings" hidden><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3z"/><circle cx="12" cy="12" r="3"/></svg></button><button class="icon" id="close" aria-label="Close chat"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
<main id="history"><form id="join" class="join"><h2>Join the conversation</h2><p>Choose your display name.</p><input id="join-name" aria-label="Display name" placeholder="Display name" minlength="2" maxlength="24" required autocomplete="nickname"><button class="primary" type="submit">Join SeaChat</button></form></main>
<footer><div id="feedback" class="feedback" role="status" hidden></div><form id="composer" class="composer" hidden><textarea id="draft" rows="1" maxlength="1000" aria-label="Message" placeholder="Message the room…"></textarea><button class="icon" id="report" type="button" aria-label="Report a message" title="Report a message"><svg viewBox="0 0 24 24"><path d="M5 21V4c5-4 9 4 14 0v10c-5 4-9-4-14 0"/></svg></button><button class="send" type="submit" aria-label="Send message" title="Send message"><svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></form></footer></div>
<div id="menu" class="menu" hidden><button id="details-action">Message details</button><button id="report-action">Report message</button></div>
<div id="overlay" class="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button class="icon" id="modal-close" aria-label="Close dialog">✕</button></div><div id="modal-feedback" class="feedback" role="status" hidden></div><div id="modal-body"></div></section></div>
<script>
(() => {
const $=id=>document.getElementById(id), colors=['#a78bfa','#f472b6','#60a5fa','#34d399','#fbbf24','#fb923c','#22d3ee'];
let chat={joined:false,messages:[],profile:null},selected=null,focusBefore=null,edit=null,previousNotice=0,lastMessages='',lastSuccess='',imageBusy=false;
const joinForm=document.getElementById('join');
const emit=(event,data)=>window.webview.send(event,data);
const element=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;};
const shortTime=value=>new Date(value).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function feedback(text){$('feedback').textContent=text||'';$('feedback').hidden=!text;}
function avatar(profile){if(profile.avatar){const img=element('img','avatar');img.src=profile.avatar;img.alt='';return img;}const el=element('span','avatar',(profile.name||'?').slice(0,1).toUpperCase()),color=colors.includes(profile.color)?profile.color:colors[0];el.style.color=color;el.style.background=color+'24';return el;}
function drawHistory(){const list=$('history'),atBottom=list.scrollHeight-list.scrollTop-list.clientHeight<70,scroll=list.scrollTop;list.replaceChildren();let day='';if(!chat.messages.length)list.append(element('p','empty','No messages yet. Start the conversation.'));chat.messages.forEach(m=>{const label=new Date(m.createdAt).toLocaleDateString([],{month:'short',day:'numeric'});if(label!==day){day=label;list.append(element('div','day',label));}const row=element('article','message'),content=element('div','content'),meta=element('div','meta'),name=element('span','name',m.name);name.style.color=colors.includes(m.color)?m.color:colors[0];const time=element('time','time',shortTime(m.createdAt));time.dateTime=m.createdAt;time.title=new Date(m.createdAt).toLocaleString();const more=element('button','icon more','⋯');more.setAttribute('aria-label','Options for message from '+m.name);more.onclick=e=>{selected=m;$('menu').hidden=false;$('menu').style.top=Math.min(e.currentTarget.getBoundingClientRect().bottom,innerHeight-100)+'px';};meta.append(name,time,more);content.append(meta,element('p','body',m.text));row.append(avatar(m),content);list.append(row);});list.scrollTop=atBottom?list.scrollHeight:scroll;}
function closeModal(){if(chat.busy||imageBusy)return;$('overlay').hidden=true;if(focusBefore&&focusBefore.isConnected)focusBefore.focus();}
function openModal(title){focusBefore=document.activeElement;$('modal-title').textContent=title;$('modal-body').replaceChildren();$('overlay').hidden=false;$('menu').hidden=true;feedback('');$('modal-close').focus();}
function field(label,input){const wrap=element('div','field'),text=element('label','',label);input.id='field-'+label.replace(/\W/g,'');text.htmlFor=input.id;wrap.append(text,input);return wrap;}
function actions(save,label){const row=element('div','actions'),cancel=element('button','secondary','Cancel'),button=element('button','primary',label);cancel.onclick=closeModal;button.onclick=save;row.append(cancel,button);$('modal-body').append(row);}
function openSettings(){if(!chat.profile)return;openModal('Your profile');edit={...chat.profile};const picture=element('div','profile-picture'),preview=element('div'),controls=element('div','picture-actions');preview.append(avatar(edit));const upload=element('button','secondary','Upload image'),remove=element('button','secondary','Remove'),file=element('input');file.type='file';file.accept='image/jpeg,image/png,image/webp';file.hidden=true;upload.onclick=()=>file.click();remove.onclick=()=>{edit.avatar='';preview.replaceChildren(avatar(edit));};
file.onchange=async()=>{const image=file.files[0];if(!image)return;if(!['image/jpeg','image/png','image/webp'].includes(image.type)||image.size>5*1024*1024){feedback('Choose a JPEG, PNG or WebP under 5 MB.');return;}imageBusy=true;upload.disabled=true;let objectUrl='';try{objectUrl=URL.createObjectURL(image);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=objectUrl;});if(img.width*img.height>25000000)throw Error('Image is too large.');const canvas=document.createElement('canvas');canvas.width=canvas.height=96;const context=canvas.getContext('2d'),side=Math.min(img.width,img.height);context.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,96,96);const converted=canvas.toDataURL('image/jpeg',.8);if(converted.length>32768)throw Error('Choose a smaller image.');edit.avatar=converted;preview.replaceChildren(avatar(edit));feedback('');}catch{feedback('Could not read this image. Try a smaller JPEG or PNG.');}finally{if(objectUrl)URL.revokeObjectURL(objectUrl);imageBusy=false;upload.disabled=false;}};
controls.append(upload,remove,file);picture.append(preview,controls);$('modal-body').append(picture,element('p','hint','JPEG, PNG or WebP · up to 5 MB. Cropped to a small square.'));const name=element('input');name.value=edit.name;name.maxLength=24;name.autocomplete='nickname';$('modal-body').append(field('Display name',name));const tools=element('div','color-tools'),random=element('button','random','Random color'),swatches=element('div','swatches');tools.append(element('span','label','Name color'),random);const repaint=()=>{swatches.replaceChildren();colors.forEach(color=>{const button=element('button','swatch'+(color===edit.color?' selected':''));button.style.background=color;button.setAttribute('aria-label','Name color '+color);button.setAttribute('aria-pressed',String(color===edit.color));button.onclick=()=>{edit.color=color;repaint();};swatches.append(button);});};random.onclick=()=>{edit.color=colors[Math.floor(Math.random()*colors.length)];repaint();};repaint();$('modal-body').append(tools,swatches);actions(()=>{if(imageBusy||chat.busy)return;emit('profile',{name:name.value,color:edit.color,avatar:edit.avatar});},'Save changes');}
function openReport(message){if(!chat.messages.length){feedback('There are no messages to report yet.');return;}openModal('Report a message');const choices=element('select');chat.messages.forEach(m=>{const option=element('option','',m.name+' · '+shortTime(m.createdAt)+' · '+m.text.slice(0,36));option.value=m.id;choices.append(option);});if(message)choices.value=message.id;const reason=element('select');['Spam','Harassment','Spoilers','Other'].forEach(value=>reason.append(element('option','',value)));const details=element('textarea','field-input');details.maxLength=1000;details.placeholder='Tell us more (optional)…';$('modal-body').append(field('Select a message',choices),field('Reason',reason),field('Add details (optional)',details));actions(()=>{if(!chat.busy)emit('report',{messageId:Number(choices.value),reason:reason.value,details:details.value});},'Submit report');}
function apply(next){const wasJoined=chat.joined;chat=next;$('connection').classList.toggle('online',!!chat.connected);$('connection').setAttribute('aria-label',chat.connected?'Connected':'Disconnected');$('settings').hidden=!chat.joined;$('composer').hidden=!chat.joined;if(!chat.joined&&wasJoined){document.getElementById("history").replaceChildren(joinForm);lastMessages='';}if(chat.joined){const key=JSON.stringify(chat.messages);if(!wasJoined||key!==lastMessages){lastMessages=key;drawHistory();}}if(chat.notice&&chat.noticeId!==previousNotice){previousNotice=chat.noticeId;feedback(chat.notice);}else if(chat.status)feedback(chat.status);if(chat.success!==lastSuccess){lastSuccess=chat.success;if(chat.success==='send'){$('draft').value='';$('draft').style.height='';feedback('');}if(chat.success==='profile'){closeModal();feedback('Profile saved.');}if(chat.success==='report'){closeModal();feedback('Report sent.');}}document.querySelectorAll('.send,.modal .primary,#join .primary').forEach(button=>button.disabled=!!chat.busy);}
$('join').onsubmit=e=>{e.preventDefault();emit('join',{name:$('join-name').value});};$('composer').onsubmit=e=>{e.preventDefault();if(!chat.busy&&$('draft').value.trim())emit('send',{text:$('draft').value});};$('draft').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('composer').requestSubmit();}};$('draft').oninput=()=>{$('draft').style.height='32px';$('draft').style.height=Math.min(80,$('draft').scrollHeight)+'px';};$('settings').onclick=openSettings;$('report').onclick=()=>openReport();$('close').onclick=()=>emit('close');$('modal-close').onclick=closeModal;$('report-action').onclick=()=>openReport(selected);$('details-action').onclick=()=>{if(!selected)return;openModal('Message details');$('modal-body').append(element('p','details',selected.name+'\n'+new Date(selected.createdAt).toLocaleString()+'\n\n'+selected.text));};document.addEventListener('click',e=>{if(!$('menu').contains(e.target)&&!e.target.closest('.more'))$('menu').hidden=true;});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('menu').hidden=true;}if(e.key==='Tab'&&!$('overlay').hidden){const controls=Array.from($('overlay').querySelectorAll('button,input,select,textarea')).filter(n=>n.offsetParent!==null&&!n.disabled),first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});if(window.webview){window.webview.on('chat',apply);emit('ready');}
})();
</script></body></html>
